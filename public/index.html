<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USA Bank Scam Complaint Portal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="appShell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-wrap">
            <div class="brand-mark">USA</div>
            <div>
              <p class="eyebrow-small">Fraud Response Center</p>
              <h1>Bank Scam Complaint Portal</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <span id="loggedInUser" class="user-pill hidden">Guest</span>
            <button id="logoutBtn" class="ghost-btn hidden">Log out</button>
          </div>
        </div>
      </header>

      <main class="container main-layout">
        <section id="loginSection" class="panel auth-panel">
          <div class="panel-header">
            <h2>Agent Login</h2>
          </div>

          <form id="loginForm" class="auth-form">
            <label>
              Agent name
              <select id="loginAgent" required>
                <option value="">Select agent</option>
              </select>
            </label>

            <label>
              Password
              <input id="loginPassword" type="password" value="bank123" required />
            </label>

            <button type="submit" class="primary-btn">Login</button>
            <p id="loginMessage" class="message hidden"></p>
          </form>
        </section>

        <section id="dashboardSection" class="hidden dashboard-section">
          <div id="summaryGrid" class="summary-grid"></div>

          <div class="divider"></div>

          <div class="toolbar card">
            <div class="toolbar-group search-group">
              <input id="searchInput" type="search" placeholder="Search by case ID, bank, complainant..." />
            </div>
            <div class="toolbar-group filter-group">
              <select id="statusFilter">
                <option value="All">All statuses</option>
                <option value="New">New</option>
                <option value="In Review">In Review</option>
                <option value="Pending">Pending</option>
                <option value="Resolved">Resolved</option>
              </select>
              <select id="priorityFilter">
                <option value="All">All priorities</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
              <select id="agentFilter">
                <option value="All">All agents</option>
              </select>
            </div>
            <div class="toolbar-group action-group">
              <button id="exportCsvBtn" class="secondary-btn">Export CSV</button>
            </div>
          </div>

          <div class="content-grid">
            <section class="panel form-panel">
              <div class="panel-header">
                <h2>New Complaint</h2>
                <span id="caseIdBadge" class="badge">Case ID: Auto-generated</span>
              </div>

              <form id="complaintForm" class="complaint-form">
                <div class="field-grid">
                  <label>
                    Complainant name
                    <input name="complainantName" type="text" placeholder="Jane Doe" required />
                  </label>

                  <label>
                    Bank name
                    <input name="bankName" type="text" placeholder="Chase" required />
                  </label>

                  <label>
                    Account type
                    <select name="bankAccount" required>
                      <option value="">Select</option>
                      <option>Checking</option>
                      <option>Savings</option>
                      <option>Credit Card</option>
                      <option>Loan</option>
                      <option>Investment</option>
                    </select>
                  </label>

                  <label>
                    Complaint type
                    <select name="complaintType" required>
                      <option value="">Select</option>
                      <option>Unauthorized Transaction</option>
                      <option>Phishing Scam</option>
                      <option>Identity Theft</option>
                      <option>Wire Fraud</option>
                      <option>Fake Account / Account takeover</option>
                      <option>Other</option>
                    </select>
                  </label>

                  <label>
                    Amount lost
                    <input name="amountLost" type="number" min="0" step="0.01" placeholder="2500.00" required />
                  </label>

                  <label>
                    Incident date
                    <input name="incidentDate" type="date" required />
                  </label>

                  <label>
                    Assign agent
                    <select name="assignedAgent" required>
                      <option value="">Select agent</option>
                    </select>
                  </label>

                  <label>
                    Priority
                    <select name="priority" required>
                      <option value="">Select</option>
                      <option>Low</option>
                      <option>Medium</option>
                      <option>High</option>
                      <option>Critical</option>
                    </select>
                  </label>
                </div>

                <label>
                  Complaint details
                  <textarea name="complaintDetails" rows="5" placeholder="Describe the scam and timeline..." required></textarea>
                </label>

                <div class="form-actions">
                  <button type="submit" class="primary-btn">Submit complaint</button>
                  <button type="reset" class="secondary-btn">Clear</button>
                </div>
              </form>
            </section>

            <section class="panel table-panel">
              <div class="panel-header table-header">
                <h2>Complaint Cases</h2>
                <span id="resultsCount" class="results-chip">0 cases</span>
              </div>

              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Case ID</th>
                      <th>Bank</th>
                      <th>Complainant</th>
                      <th>Agent</th>
                      <th>Priority</th>
                      <th>Status</th>
                      <th>Amount</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="casesTableBody"></tbody>
                </table>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
